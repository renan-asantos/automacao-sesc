[project]
name = "automacao-sesc"
version = "0.1.0"
description = "Buscar no site do sesc bertioga se as inscrições estão abertas"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "dateparser>=1.4.2",
    "httpx2>=2.12.0",
    "loguru>=0.7.3",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]
